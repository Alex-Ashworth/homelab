server {
    listen 80;
    server_name pihole.alex-ashworth.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name pihole.alex-ashworth.com;
    ssl_certificate /etc/letsencrypt/live/pihole.alex-ashworth.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pihole.alex-ashworth.com/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;
    include /etc/nginx/snippets/tailscale-docker-only.conf;

    location = / {
      return 302 /admin/;
    }
    
    location / {
      proxy_pass http://pihole:80;
      include /etc/nginx/snippets/proxy-common.conf;
    }
}
